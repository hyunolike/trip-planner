spring:
  application:
    name: tripnote-api
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            scope: [openid, email, profile]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tripnote}
    username: ${DATABASE_USER:tripnote}
    password: ${DATABASE_PASSWORD:tripnote}
    hikari:
      maximum-pool-size: 10
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # 메일 리스너는 트랜잭션 안에서 돌므로 SMTP가 멈추면 DB 커넥션이 묶인다.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      timeout: 3s
  session:
    timeout: 30d
    data:
      redis:
        namespace: tripnote:session
        repository-type: indexed
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  modulith:
    events:
      completion-mode: delete
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: true
server:
  forward-headers-strategy: native
  shutdown: graceful
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
tripnote:
  web-base-url: ${TRIPNOTE_WEB_BASE_URL:http://localhost:3000}
  mail-from: ${TRIPNOTE_MAIL_FROM:no-reply@tripnote.local}
  samples-dir: ${TRIPNOTE_SAMPLES_DIR:../../sample}
  system-user-email: ${TRIPNOTE_SYSTEM_USER_EMAIL:ops@tripnote.local}
  seed-samples: ${TRIPNOTE_SEED_SAMPLES:false}

# 계약 파일이 실행마다 같도록 키를 정렬한다.
springdoc:
  writer-with-order-by-keys: true
  api-docs:
    version: openapi_3_1
