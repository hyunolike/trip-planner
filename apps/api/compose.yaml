services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: tripnote
      POSTGRES_USER: tripnote
      POSTGRES_PASSWORD: tripnote
    ports: ["5432:5432"]
    volumes: ["db-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tripnote -d tripnote"]
      interval: 2s
      timeout: 3s
      retries: 30
  valkey:
    image: valkey/valkey:9.1
    command: ["valkey-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
  mail:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
volumes:
  db-data:
