<!-- @dsCard group="Overlays" height=460 subtitle="일정 추가 시트" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<div class="tn-canvas">
  <div class="tn-sheet-demo" aria-hidden="true">
    <div class="tn-sheet__scrim"></div>
    <div class="tn-sheet" role="dialog" aria-label="일정 추가">
      <div class="tn-sheet__handle"></div>
      <h2 class="tn-sheet__title">일정 추가 · 2일차</h2>
      <div class="tn-field"><label class="tn-field__label" for="s1">제목 <b>*</b></label><input class="tn-field__input" id="s1" placeholder="예: 아라시야마 대나무숲"></div>
      <div class="tn-row" style="gap:12px">
        <div class="tn-field" style="width:120px"><label class="tn-field__label" for="s2">시각</label><input class="tn-field__input tn-mono" id="s2" value="10:30"></div>
        <div class="tn-field" style="width:140px"><label class="tn-field__label" for="s3">소요</label><input class="tn-field__input" id="s3" value="약 1시간"></div>
      </div>
      <button class="tn-btn tn-btn--primary tn-btn--lg" type="button">추가</button>
    </div>
  </div>
</div>
