name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm sample:validate
      - name: local sizing harness syntax
        run: python3 -m py_compile scripts/local-sizing/*.py scripts/free-tier/*.py
      - name: design tokens are built from tokens.json
        run: |
          pnpm --filter @tripnote/design-tokens build
          git diff --exit-code -- packages/design-tokens/dist
          test -z "$(git status --porcelain -- packages/design-tokens/dist)"
          pnpm --filter @tripnote/design-tokens test

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - run: ./gradlew check
      - name: jOOQ generated code is up to date
        run: |
          docker compose up -d --wait db
          timeout 60 bash -c 'until docker compose exec -T db pg_isready -h 127.0.0.1 -U tripnote -d tripnote; do sleep 1; done'
          ./gradlew flywayClean flywayMigrate jooqCodegen
          git diff --exit-code -- src/main/generated
          test -z "$(git status --porcelain -- src/main/generated)"

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: api types match openapi.json
        working-directory: apps/web
        run: |
          pnpm gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - working-directory: apps/web
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build

  e2e:
    needs: [api, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: start database, valkey and mailpit
        working-directory: apps/api
        run: docker compose up -d --wait
      - name: start api with samples
        working-directory: apps/api
        run: |
          ./gradlew bootJar
          JAR=$(find build/libs -name '*.jar' ! -name '*-plain.jar' | head -1)
          TRIPNOTE_SEED_SAMPLES=true nohup java -jar "$JAR" > api.log 2>&1 &
          timeout 120 bash -c 'until curl -sf http://localhost:8080/actuator/health/readiness; do sleep 2; done'
      - name: e2e
        working-directory: apps/web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm build
          pnpm e2e
      - name: api log on failure
        if: failure()
        run: tail -n 200 apps/api/api.log
      - name: upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
